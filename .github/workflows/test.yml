name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [v0.11.5, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Get submode
        run: git clone --depth 1 https://github.com/sirasagi62/nvim-submode .deps/nvim-submode
      - name: Check
        run: nvim --headless -u NONE -l tests/run.lua
